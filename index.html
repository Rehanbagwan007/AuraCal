<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraCalc - Modern Smart Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-app">
    <!-- Header bar -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">AuraCalc</span>
        <span class="badge" id="mode-badge">Standard</span>
      </div>
      <div class="header-actions">
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle Sound">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg class="icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <button id="mode-toggle-btn" class="icon-btn" title="Switch Standard / Scientific" aria-label="Switch Mode">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <circle cx="9" cy="15" r="1"></circle>
            <circle cx="15" cy="9" r="1"></circle>
          </svg>
        </button>
        <button id="history-toggle-btn" class="icon-btn" title="Calculation History" aria-label="Calculation History">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main calculator container -->
    <main class="calculator-container">
      <!-- Screen / Display section -->
      <section class="display-section" id="display-section" title="Click to copy result">
        <div class="display-meta">
          <div class="memory-indicators">
            <span class="mem-badge" id="mem-indicator">M</span>
            <span class="angle-badge" id="angle-indicator">DEG</span>
          </div>
          <div class="history-expression" id="secondary-display"></div>
        </div>
        <div class="result-display-wrapper">
          <div class="main-display" id="main-display">0</div>
        </div>
        <div class="copy-hint" id="copy-hint">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Copied!</span>
        </div>
      </section>

      <!-- Memory Controls Bar -->
      <section class="memory-bar">
        <button class="mem-btn" data-action="mc">MC</button>
        <button class="mem-btn" data-action="mr">MR</button>
        <button class="mem-btn" data-action="m-plus">M+</button>
        <button class="mem-btn" data-action="m-minus">M-</button>
        <button class="mem-btn" data-action="ms">MS</button>
      </section>

      <!-- Keypad section -->
      <section class="keypad-grid" id="keypad">
        <!-- Scientific row group (collapsible/toggleable) -->
        <div class="scientific-panel" id="scientific-panel">
          <button class="key func-key" data-action="deg-rad" id="deg-rad-btn">RAD</button>
          <button class="key func-key" data-action="sin">sin</button>
          <button class="key func-key" data-action="cos">cos</button>
          <button class="key func-key" data-action="tan">tan</button>
          <button class="key func-key" data-action="ln">ln</button>
          <button class="key func-key" data-action="log">log</button>
          <button class="key func-key" data-action="power">xʸ</button>
          <button class="key func-key" data-action="sqr">x²</button>
          <button class="key func-key" data-action="pi">π</button>
          <button class="key func-key" data-action="e">e</button>
        </div>

        <!-- Primary standard keys -->
        <div class="standard-panel">
          <!-- Row 1 -->
          <button class="key action-key clear-key" data-action="clear" data-key="Escape" title="Clear (Esc)">AC</button>
          <button class="key action-key" data-action="backspace" data-key="Backspace" title="Backspace">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
          </button>
          <button class="key action-key" data-action="bracket" data-key="(">(</button>
          <button class="key action-key" data-action="bracket" data-key=")">)</button>
          <button class="key op-key" data-action="operator" data-op="/" data-key="/">÷</button>

          <!-- Row 2 -->
          <button class="key func-key" data-action="sqrt">√</button>
          <button class="key num-key" data-key="7">7</button>
          <button class="key num-key" data-key="8">8</button>
          <button class="key num-key" data-key="9">9</button>
          <button class="key op-key" data-action="operator" data-op="*" data-key="*">×</button>

          <!-- Row 3 -->
          <button class="key func-key" data-action="percent" data-key="%">%</button>
          <button class="key num-key" data-key="4">4</button>
          <button class="key num-key" data-key="5">5</button>
          <button class="key num-key" data-key="6">6</button>
          <button class="key op-key" data-action="operator" data-op="-" data-key="-">−</button>

          <!-- Row 4 -->
          <button class="key func-key" data-action="negate">±</button>
          <button class="key num-key" data-key="1">1</button>
          <button class="key num-key" data-key="2">2</button>
          <button class="key num-key" data-key="3">3</button>
          <button class="key op-key" data-action="operator" data-op="+" data-key="+">+</button>

          <!-- Row 5 -->
          <button class="key func-key" data-action="factorial">n!</button>
          <button class="key num-key" data-key="0">0</button>
          <button class="key num-key" data-action="decimal" data-key=".">.</button>
          <button class="key equals-key" data-action="calculate" data-key="Enter" data-alt-key="=">=</button>
        </div>
      </section>
    </main>

    <!-- History Drawer / Sidebar -->
    <aside class="history-drawer" id="history-drawer">
      <div class="history-header">
        <h3>Calculation History</h3>
        <button id="close-history-btn" class="icon-btn" aria-label="Close History">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <!-- Rendered dynamically -->
      </div>
      <div class="history-footer">
        <button id="clear-history-btn" class="clear-history-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Clear History
        </button>
      </div>
    </aside>

    <!-- Keyboard Shortcuts Guide Modal / Popover -->
    <footer class="app-footer">
      <span class="hint-text">Tip: Use keyboard numbers & operators, <kbd>Enter</kbd> to evaluate, <kbd>Esc</kbd> to clear</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
